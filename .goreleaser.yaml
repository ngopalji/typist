# Release config for GoReleaser (https://goreleaser.com).
# Pushing a v* tag runs this via .github/workflows/release.yml. Builds are
# static thanks to the pure-Go SQLite driver.
version: 2

project_name: typist

builds:
  - main: ./cmd/typist
    binary: typist
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # "v" prefix so `typist version` matches go install and make install.
    ldflags: ["-s -w -X main.version=v{{.Version}}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# For `brew install ngopalji/tap/typist`, create a github.com/ngopalji/homebrew-tap
# repo and add a homebrew_casks section:
# https://goreleaser.com/customization/homebrew_casks/
